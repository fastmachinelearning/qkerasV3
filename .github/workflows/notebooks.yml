name: Execute Notebooks on Commit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-notebooks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tensorflow keras qkeras-v3 numpy papermill ipykernel

    - name: Run Notebooks via Papermill
      run: |
        papermill tutorials/QKerasActivations.ipynb tutorials/QKerasActivations_executed.ipynb
        papermill tutorials/QKerasAutoencoder.ipynb tutorials/QKerasAutoencoder_executed.ipynb
        papermill tutorials/QKerasCNN.ipynb tutorials/QKerasCNN_executed.ipynb
        papermill tutorials/QKerasCodebook.ipynb tutorials/QKerasCodebook_executed.ipynb
        papermill tutorials/QKerasBinaryMI.ipynb tutorials/QKerasBinaryMI_executed.ipynb

    - name: Upload executed notebooks
      if: always()
      uses: actions/artifacts@v4
      with:
        name: executed-notebooks
        path: output_*_executed.ipynb
