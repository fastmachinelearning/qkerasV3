name: Execute Notebooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow keras qkeras-v3 numpy papermill ipykernel

      - name: Execute tutorial notebooks
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          for notebook in tutorials/*.ipynb; do
            # Skip previously executed notebooks if they exist
            [[ "$notebook" == *_executed.ipynb ]] && continue

            echo "::group::Executing ${notebook}"
            papermill \
              "$notebook" \
              "${notebook%.ipynb}_executed.ipynb"
            echo "::endgroup::"
          done
